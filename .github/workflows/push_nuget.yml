name: push_nuget

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version (with or without a leading v)
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Nuget.exe
        uses: nuget/setup-nuget@v4

      - name: Acquire FFmpeg runtime
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eng/Acquire-FFmpegRuntime.ps1

      - name: Test
        run: dotnet test tests/VL.FFmpeg.Tests/VL.FFmpeg.Tests.csproj -c Release --nologo

      - name: Extract version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          $cleanVersion = $version.TrimStart("v")
          $isPrerelease = $cleanVersion -match "-"
          "VERSION=$cleanVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Pack
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eng/Pack.ps1 -Version ${{ env.VERSION }}

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: antokhio

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem -Path artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }

      - name: GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          artifacts: artifacts/packages/*
          generateReleaseNotes: true
          allowUpdates: true
          prerelease: ${{ env.IS_PRERELEASE == 'True' }}
          token: ${{ secrets.GITHUB_TOKEN }}
